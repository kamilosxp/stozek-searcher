<!-- widget/index.html -->
<div id="lozyska-wyszukiwarka" class="lw-widget">
  <h2 class="lw-title">Wyszukaj po wymiarach</h2>
  <form id="lw-form" class="lw-form">
    <div class="lw-field">
      <label for="lw-inner">Średnica wewnętrzna</label>
      <input type="number" step="0.01" id="lw-inner">
    </div>
    <div class="lw-field">
      <label for="lw-outer">Średnica zewnętrzna</label>
      <input type="number" step="0.01" id="lw-outer">
    </div>
    <div class="lw-field">
      <label for="lw-width">Szerokość</label>
      <input type="number" step="0.01" id="lw-width">
    </div>
    <div class="lw-field">
      <label for="lw-tolerance">Tolerancja</label>
      <input type="number" step="0.01" id="lw-tolerance" value="0.9">
    </div>
    <button type="submit" class="lw-submit">wyszukaj</button>
  </form>
  <div id="lw-message" class="lw-message"></div>
  <ul id="lw-results" class="lw-results"></ul>
</div>

<style>
  #lozyska-wyszukiwarka.lw-widget { font-family: Arial, Helvetica, sans-serif; max-width: 1100px; }
  #lozyska-wyszukiwarka .lw-title { font-size: 20px; font-weight: 400; margin: 0 0 14px; padding-bottom: 14px; color: #333; border-bottom: 1px solid #ddd; }
  #lozyska-wyszukiwarka .lw-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
  #lozyska-wyszukiwarka .lw-field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 160px; min-width: 140px; }
  #lozyska-wyszukiwarka .lw-field label { font-size: 13px; color: #444; }
  #lozyska-wyszukiwarka .lw-field input { padding: 10px 12px; border: 1px solid #ccc; border-radius: 2px; font-size: 14px; box-sizing: border-box; width: 100%; }
  #lozyska-wyszukiwarka .lw-submit { flex: 0 0 auto; background: #d0021b; color: #fff; border: none; padding: 12px 32px; font-size: 14px; cursor: pointer; border-radius: 2px; margin-left: auto; }
  #lozyska-wyszukiwarka .lw-submit:hover { background: #b0011a; }
  #lozyska-wyszukiwarka .lw-message { margin-top: 12px; color: #555; }
  #lozyska-wyszukiwarka .lw-results { list-style: none; margin: 16px 0 0; padding: 0; }
  #lozyska-wyszukiwarka .lw-results li { padding: 10px 0; border-bottom: 1px solid #eee; }
  #lozyska-wyszukiwarka .lw-results a { color: #333; text-decoration: none; }
  #lozyska-wyszukiwarka .lw-results a:hover { text-decoration: underline; }
</style>

<script>
(function () {
  var DATA_URL = 'https://kamilosxp.me/stozek-searcher/data.json';

  function matchProducts(products, criteria) {
    var tolerance = criteria.tolerance == null ? 0 : criteria.tolerance;
    var dims = ['d', 'D', 'B'].filter(function (key) {
      return criteria[key] !== undefined && criteria[key] !== null && criteria[key] !== '';
    });
    if (dims.length === 0) return { error: 'NO_CRITERIA', results: [] };

    var results = [];
    products.forEach(function (product) {
      var matches = true;
      var deviation = 0;
      for (var i = 0; i < dims.length; i += 1) {
        var key = dims[i];
        var diff = Math.abs(product[key] - criteria[key]);
        if (diff > tolerance) { matches = false; break; }
        deviation += diff;
      }
      if (matches) results.push(Object.assign({}, product, { deviation: deviation }));
    });
    results.sort(function (a, b) { return a.deviation - b.deviation; });
    return { error: null, results: results };
  }

  var products = null;
  var loadFailed = false;
  var messageEl = document.getElementById('lw-message');
  var resultsEl = document.getElementById('lw-results');
  var formEl = document.getElementById('lw-form');

  fetch(DATA_URL)
    .then(function (res) { if (!res.ok) throw new Error('bad status'); return res.json(); })
    .then(function (data) { products = data; })
    .catch(function () {
      loadFailed = true;
      messageEl.textContent = 'Wyszukiwarka chwilowo niedostępna.';
    });

  function numOrUndefined(value) {
    return value === '' ? undefined : Number(value);
  }

  formEl.addEventListener('submit', function (event) {
    event.preventDefault();
    resultsEl.innerHTML = '';
    messageEl.textContent = '';

    if (!products) {
      messageEl.textContent = loadFailed
        ? 'Wyszukiwarka chwilowo niedostępna.'
        : 'Dane się jeszcze ładują, spróbuj za chwilę.';
      return;
    }

    var criteria = {
      d: numOrUndefined(document.getElementById('lw-inner').value),
      D: numOrUndefined(document.getElementById('lw-outer').value),
      B: numOrUndefined(document.getElementById('lw-width').value),
      tolerance: numOrUndefined(document.getElementById('lw-tolerance').value),
    };

    var outcome = matchProducts(products, criteria);

    if (outcome.error === 'NO_CRITERIA') {
      messageEl.textContent = 'Wpisz przynajmniej jeden wymiar.';
      return;
    }

    if (outcome.results.length === 0) {
      messageEl.textContent = 'Brak łożysk w tym zakresie.';
      return;
    }

    outcome.results.forEach(function (r) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = r.url;
      a.textContent = r.name + ' — d:' + r.d + ' D:' + r.D + ' B:' + r.B + ' — ' + r.price + ' zł';
      li.appendChild(a);
      resultsEl.appendChild(li);
    });
  });
})();
</script>
